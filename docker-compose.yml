# Local stack: API replicas behind nginx, plus the dashboard.
#
#   docker compose up --build                    # 1 API replica
#   docker compose up -d --scale api=4           # 4 replicas for the load test
#
# The API is intentionally not port-mapped: with several replicas a host port
# could only bind to one of them, so all traffic goes through nginx on :8080
# and is genuinely distributed.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
      STATE_DIR: /app/state
    deploy:
      resources:
        limits:
          # Mirrors the free-tier ceiling the architecture targets, so local
          # testing fails the same way production would rather than passing
          # on a machine with 14 GB and OOM-ing after deploy.
          memory: 512M
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    environment:
      # Through nginx, so the dashboard exercises the same balanced path as
      # the load test.
      API_URL: http://nginx:80
    ports:
      - "8501:8501"
    depends_on:
      - nginx
    restart: unless-stopped
