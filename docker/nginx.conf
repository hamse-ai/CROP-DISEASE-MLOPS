# Load balancer in front of the API replicas.
#
# This exists for the load test. `docker compose up --scale api=N` starts N
# containers, but without something distributing traffic across them Locust
# would still hit a single address and the container-count comparison would
# measure nothing. Docker's embedded DNS returns all replica IPs for the
# service name; `resolve` makes nginx re-query it so replicas are picked up
# without a reload.

events { worker_connections 2048; }

http {
    access_log off;                 # keep logging off the latency path
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_pool {
        zone api_pool 64k;
        server api:8000 resolve max_fails=0;
        keepalive 64;
    }

    server {
        listen 80;
        client_max_body_size 120M;  # bulk image upload

        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Retraining is seconds-scale but embedding a large upload batch
            # can exceed the default 60s read timeout.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
